[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ledgerguard"
version = "0.1.0"
description = "Self-governing AI accountant / payment-ops agent. The Stripe accountant that does not trust itself with your money."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ben + Alex" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4"]
stripe = ["stripe>=8"]
llm = ["httpx>=0.27"]

[project.scripts]
ledgerguard-demo = "ledgerguard.cli:main"

[tool.setuptools.packages.find]
include = ["ledgerguard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

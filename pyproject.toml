[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arbiter"
version = "0.1.0"
description = "Self-governing AI accountant / payment-ops agent. The Stripe accountant that does not trust itself with your money."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ben + Alex" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4"]
stripe = ["stripe>=8"]
llm = ["httpx>=0.27"]
web = ["fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
arbiter-demo = "arbiter.cli:main"

[tool.setuptools.packages.find]
include = ["arbiter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
